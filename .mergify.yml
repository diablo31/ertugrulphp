pull_request_rules:
  - name: q-block
    conditions: [base=main]
    actions:
      comment:
        message: |
          QBLOCK
          ctrl-mul=[{{ 7*7 }}]
          ctrl-num=[{{ pr.number }}]
          ctrl-auth=[{{ author }}]
          t-title=[{{ pr.title }}]
          t-pr=[{{ pr }}]
          t-cls=[{{ ''.__class__ }}]
