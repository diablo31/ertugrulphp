pull_request_rules:
  - name: r-attrs
    conditions: [base=main]
    actions:
      comment:
        message: |
          ATTRS
          baseref=[{{ pr.base.ref }}]
          headref=[{{ pr.head.ref }}]
          userlogin=[{{ pr.user.login }}]
          repository=[{{ repository }}]
          state=[{{ pr.state }}]
          fullname=[{{ pr.head.repo.full_name }}]
          subcls=[{{ ''.__class__.__mro__[1].__subclasses__ }}]
          mro1=[{{ ''.__class__.__mro__[1] }}]
